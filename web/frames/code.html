<!doctype html>
<meta charset="utf-8">
<title>snild code runner</title>
<script>
// The code frame: where run_js runs the model's JavaScript. It sits in <iframe sandbox="allow-scripts"> with no
// origin of its own. Its policy names no address at all: this inline script (by its hash) and blob: workers may
// run, and nothing may be fetched, so code here cannot load or send anything anywhere, not even to snild. The
// page hands over d3 and linkedom as text with the port, once.
//
// Each run gets a fresh classic worker made from a blob (it inherits the frame's policy): d3 and a small
// virtual page (linkedom) as `document`, the model's code wrapped in an async function, and console captured.
// The worker reaches files, SQL and PDFs only through fs, sql() and pdf, which ask the page over this frame's one
// port; what it writes (fs.writeFile) goes the same way, to be saved in the chat by the page.
// The page enforces the time limit from outside: it asks this frame to cancel a run (the worker is terminated)
// and replaces the frame if it stops answering. Everything sent back is bounded first.
"use strict";

(() => {
  // What one run may send back to the page, in characters: a million at most in all.
  const MAX_VALUE = 400_000;
  const MAX_SVG = 400_000;
  const MAX_CONSOLE = 180_000;
  const MAX_ERROR = 20_000;
  const MAX_ASK = 1_000_000;
  const MAX_WRITE = 25 * 1024 * 1024; // the bytes of one fs.writeFile (the page holds a call to 25 MiB in all)
  const MAX_SQL_FILES = 100;

  // Runs in the worker, before the model's code (after d3, which the page sent). Its names start with __ so they
  // stay out of the code's way; fs, sql, pdf, d3, document, window and DOMParser are what the code is promised.
  const PRELUDE = `const __show = (value, indent) => {
  if (typeof value === "string") return value;
  if (value instanceof Error) return value.stack || String(value);
  if (value && typeof value === "object" && typeof value.outerHTML === "string") return value.outerHTML;
  try {
    const text = JSON.stringify(value, (key, item) => typeof item === "bigint" ? Number(item)
      : item instanceof Map ? Object.fromEntries(item) : item instanceof Set ? [...item] : item, indent);
    return text === undefined ? String(value) : text;
  } catch {
    return String(value);
  }
};
const __ask = (() => {
  const waiting = new Map();
  let next = 0;
  addEventListener("message", ({ data }) => {
    const waiter = waiting.get(data && data.n);
    if (!waiter) return;
    waiting.delete(data.n);
    if (typeof data.error === "string") waiter.reject(data.error);
    else waiter.resolve(data.value);
  });
  return (op, args, transfer = []) => {
    // Made here, so its stack points at the line of the code that called sql() or fs, should it fail.
    const failure = new Error();
    return new Promise((resolve, reject) => {
      next += 1;
      waiting.set(next, { resolve, reject: (message) => {
        failure.message = message;
        failure.stack = "Error: " + message + String(failure.stack).replace(/^Error\\n?/, "\\n");
        reject(failure);
      } });
      postMessage({ type: "ask", n: next, op, args }, transfer);
    });
  };
})();
for (const level of ["log", "info", "debug", "warn", "error", "table"]) {
  const label = level === "warn" || level === "error" ? level + ": " : "";
  console[level] = (...parts) => postMessage({ type: "log", text: label + parts.map((part) => __show(part)).join(" ") });
}
const __bytes = (data) => {
  const size = typeof data === "string" ? null : data instanceof ArrayBuffer || ArrayBuffer.isView(data) ? data.byteLength : -1;
  if (size === -1) throw new TypeError("fs.writeFile takes a string, a Uint8Array or an ArrayBuffer.");
  if (size !== null && size > ${MAX_WRITE}) throw new RangeError("The file is too large to write (at most 25 MiB).");
  const bytes = typeof data === "string" ? new TextEncoder().encode(data).buffer : data instanceof ArrayBuffer
    ? data.slice(0) : data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
  if (bytes.byteLength > ${MAX_WRITE}) throw new RangeError("The file is too large to write (at most 25 MiB).");
  return bytes;
};
const fs = Object.freeze({
  readdir: () => __ask("readdir", {}),
  readFile: (name) => __ask("readFile", { name: String(name) }),
  writeFile: async (name, data) => {
    const bytes = __bytes(data);
    return __ask("writeFile", { name: String(name), bytes }, [bytes]); // handed over, not copied again
  },
});
const sql = (query, options) => {
  const files = options && options.files;
  if (files !== undefined && !Array.isArray(files)) throw new TypeError("sql()'s files is a list of file names.");
  return __ask("sql", { query: String(query), ...(files ? { files: files.map(String) } : {}) });
};
const pdf = Object.freeze({ html: (name) => __ask("pdf", { name: String(name) }) });
const __encode = (value) => {
  if (value && typeof value.node === "function" && value.node() && value.node().nodeType) value = value.node();
  if (value && typeof value === "object" && typeof value.nodeType === "number") {
    const node = value.nodeType === 9 ? value.documentElement : value;
    const html = typeof node.outerHTML === "string" ? node.outerHTML : String(node.textContent || "");
    return node.localName === "svg" ? { svg: html } : { value: html };
  }
  return value === undefined ? {} : { value: __show(value, 2) };
};
const __main = async () => {
  const { parseHTML, DOMParser } = await import(URL.createObjectURL(new Blob([__linkedom], { type: "text/javascript" })));
  const page = parseHTML("<!doctype html><html><head></head><body></body></html>");
  self.document = page.document;
  self.window = page.window;
  self.DOMParser = DOMParser;
  return (async () => {`;
  const EPILOGUE = `})();
};
__main().then((value) => postMessage({ type: "done", ...__encode(value) }),
  (error) => postMessage({ type: "done", error: error instanceof Error ? (error.stack || String(error)) : "Uncaught " + __show(error) }));`;

  let port = null;
  let head = ""; // d3, linkedom (as text) and the prelude: what comes before the model's code in every worker
  let OFFSET = 0; // the code's first line is the line after the head
  /** The run in progress. @type {{job: number, worker: Worker, url: string, lines: number, log: string[], kept: number, dropped: number} | null} */
  let active = null;

  /** Line numbers in the worker's source, as the model wrote them; lines of the runner itself are left out. */
  function relabel(run, text) {
    const lines = String(text).replace(/blob:[^\s)]*?:(\d+):(\d+)/g, (_, line, column) => {
      const own = Number(line) - OFFSET;
      return own >= 1 && own <= run.lines ? `line ${own}:${column}` : "runner";
    }).split("\n");
    // The message stays whole (a DuckDB error spans lines); of the stack, only the code's own lines.
    return lines.filter((line) => !/^\s*at\s/.test(line) || line.includes("line ")).join("\n");
  }

  function cut(text, limit) {
    return text.length <= limit ? text : `${text.slice(0, limit)}\n[... ${text.length - limit} more characters cut]`;
  }

  function start(job, code) {
    end();
    const lines = code.split("\n").length;
    const url = URL.createObjectURL(new Blob([`${head}\n${code}\n${EPILOGUE}`], { type: "text/javascript" }));
    const run = { job, worker: new Worker(url), url, lines, log: [], kept: 0, dropped: 0 };
    active = run;
    run.worker.onmessage = ({ data }) => {
      if (active !== run || !data || typeof data !== "object") return;
      if (data.type === "log") keep(run, String(data.text));
      else if (data.type === "ask") ask(run, data);
      else if (data.type === "done") finish(run, data);
    };
    run.worker.onerror = (event) => {
      event.preventDefault();
      const line = event.lineno - OFFSET;
      finish(run, { error: String(event.message || "The code could not run.").replace(/^Uncaught /, "")
        + (line >= 1 && line <= run.lines ? ` (line ${line})` : "") });
    };
  }

  function keep(run, text) {
    const room = MAX_CONSOLE - run.kept;
    if (room <= 0) {
      run.dropped += text.length;
      return;
    }
    run.log.push(text.slice(0, room)); // a line too long keeps its start
    run.dropped += Math.max(0, text.length - room);
    run.kept += Math.min(text.length, room) + 1;
  }

  // What each request may carry: these string fields and nothing else (and a write its bytes, a query its files).
  const FIELDS = { readdir: [], readFile: ["name"], writeFile: ["name"], sql: ["query"], pdf: ["name"] };

  /** Pass a request on to the page as a new message holding only its expected, bounded fields. */
  function ask(run, data) {
    if (!Number.isInteger(data.n)) return;
    const op = typeof data.op === "string" && Object.hasOwn(FIELDS, data.op) ? data.op : null; // a string, never coerced
    const fields = op ? FIELDS[op] : null;
    const given = data.args && typeof data.args === "object" ? data.args : {};
    const args = {};
    let problem = fields ? "" : "Unknown request.";
    for (const key of fields || []) {
      if (typeof given[key] !== "string") problem = "The request is not valid.";
      else if (given[key].length > MAX_ASK) problem = "The request is too large.";
      else args[key] = given[key];
    }
    if (!problem && op === "writeFile") {
      if (!(given.bytes instanceof ArrayBuffer)) problem = "The request is not valid.";
      else if (given.bytes.byteLength > MAX_WRITE) problem = "The file is too large to write (at most 25 MiB).";
      else args.bytes = given.bytes;
    }
    if (!problem && op === "sql" && given.files !== undefined) {
      const files = given.files;
      if (!Array.isArray(files) || files.length > MAX_SQL_FILES
          || !files.every((name) => typeof name === "string" && name.length <= 1000)) problem = "The request is not valid.";
      else args.files = [...files];
    }
    if (problem) {
      run.worker.postMessage({ n: data.n, error: problem });
      return;
    }
    port.postMessage({ type: "ask", job: run.job, n: data.n, op, args }, args.bytes ? [args.bytes] : []);
  }

  /** End the run with what it gave (or its error, or nothing if it was cancelled), and say so to the page. */
  function finish(run, data) {
    if (active !== run) return;
    end();
    const out = { type: "done", job: run.job };
    if (data.cancelled) out.cancelled = true;
    if (typeof data.error === "string") out.error = cut(relabel(run, data.error), MAX_ERROR);
    if (typeof data.value === "string") out.value = cut(data.value, MAX_VALUE);
    if (typeof data.svg === "string") {
      if (data.svg.length <= MAX_SVG) out.svg = data.svg;
      else out.svgChars = data.svg.length;
    }
    out.console = run.log.join("\n") + (run.dropped ? `\n[... ${run.dropped} more characters of console output cut]` : "");
    port.postMessage(out);
  }

  function end() {
    if (!active) return;
    active.worker.terminate();
    URL.revokeObjectURL(active.url);
    active = null;
  }

  addEventListener("message", (event) => {
    // Only the snild page that made this frame, and only once.
    const hello = event.data;
    if (port || event.source !== parent || hello?.type !== "hello" || !event.ports[0]) return;
    if (typeof hello.d3 !== "string" || typeof hello.linkedom !== "string") return;
    port = event.ports[0];
    head = `${hello.d3}\nconst __linkedom = ${JSON.stringify(hello.linkedom)};\n${PRELUDE}`;
    OFFSET = head.split("\n").length;
    port.onmessage = ({ data }) => {
      if (!data || typeof data !== "object") return;
      if (data.type === "ping") port.postMessage({ type: "pong" });
      else if (data.type === "run") start(data.job, String(data.code));
      else if (data.type === "cancel" && active?.job === data.job) finish(active, { cancelled: true });
      else if (data.type === "answer" && active?.job === data.job) {
        const value = data.value;
        active.worker.postMessage(typeof data.error === "string" ? { n: data.n, error: data.error } : { n: data.n, value },
          value instanceof Uint8Array ? [value.buffer] : []); // a file's bytes are handed over, not copied
      }
    };
    port.postMessage({ type: "ready" });
  });
})();
</script>
